[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pscf-im"
version = "1.0.0"
description = "Path-Specific Counterfactual Fairness for Influence Maximization"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "networkx>=3.2",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = ["pytest>=8.0", "tqdm>=4.66"]

[tool.setuptools.packages.find]
include = ["pscf_im*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
